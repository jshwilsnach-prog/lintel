<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dimensions</title>
  <link rel="stylesheet" href="../css/house.css" />
</head>
<body>
  <main class="wrap">
    <nav class="bar"><a href="../index.html">lintel</a><a href="https://nekyia.me">door</a></nav>
    <p class="subtle">Not a graphics setting.</p>
    <h1>3D · 2D · 1D · 0D</h1>
    <p>The walking holds in 3D, 2D, 1D, 0D, and a loop. Same law.</p>
    <div class="row">
      <button data-d="3">3D</button>
      <button data-d="2">2D</button>
      <button data-d="1">1D</button>
      <button data-d="0">0D</button>
    </div>
    <canvas id="c" width="720" height="420"></canvas>
    <p id="note" class="muted">A room. A line. A point. Rank is still 0.</p>
  </main>
  <script type="module">
    import { asRank } from "../src/game/law.js";
    const c = document.getElementById("c"), ctx = c.getContext("2d");
    let d = 3, t = 0;
    function draw() {
      t += 0.016;
      ctx.fillStyle = "#07080f"; ctx.fillRect(0,0,720,420);
      ctx.strokeStyle = "#3dffc8"; ctx.fillStyle = "#ff2bd6";
      const cx=360, cy=210;
      if (d === 3) {
        for (let i=0;i<8;i++) {
          const a = t + i*Math.PI/4, x = cx+Math.cos(a)*120, y = cy+Math.sin(a)*50;
          ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
        }
      } else if (d === 2) {
        ctx.beginPath(); ctx.arc(cx,cy,90,0,Math.PI*2); ctx.stroke();
      } else if (d === 1) {
        ctx.beginPath(); ctx.moveTo(80,cy); ctx.lineTo(640,cy); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2); ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
      d = Number(b.dataset.d);
      document.getElementById("note").textContent = d + "D. asRank of a dimension is " + asRank(d) + ".";
    });
    draw();
  </script>
</body>
</html>
